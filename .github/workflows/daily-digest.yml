name: Manual AI Signal generation check (Gemini option)

on:
  workflow_dispatch:

concurrency:
  group: ai-pulse-digest
  cancel-in-progress: false

jobs:
  daily-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run offline core tests
        run: python -m pytest -q tests/test_process.py tests/test_fetch_news.py tests/test_storage.py tests/test_summarize.py tests/test_pipeline.py tests/test_rerun_selection.py tests/test_runs.py tests/test_review_flow.py tests/test_story_pool.py tests/test_automatic.py tests/test_summary_cache.py tests/test_ollama.py

      - name: Generate and validate a draft in the runner
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python main.py generate
          if [ -f data/draft_digest.json ]; then
            python main.py validate --draft
          else
            python main.py validate
          fi
